services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://flogg:${POSTGRES_PASSWORD}@db:5432/flogg
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-true}
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3010:3000"   # optional: local access at http://localhost:3010
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flogg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flogg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flogg -d flogg"]
      interval: 5s
      timeout: 5s
      retries: 10

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
